services:
  # C++ Server
  server:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile
    container_name: copadrive_server
    ports:
      - "5555:5555"
    environment:
      - PATH_DIR=/usr/src/mytest/storage
    networks:
      - copadrive-network

  # Web Server
  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    container_name: copadrive_web
    ports:
      - "3000:3000"
    environment:
      - CPP_SERVER_HOST=server
      - CPP_SERVER_PORT=5555
    networks:
      - copadrive-network
    env_file:
      - ./web-server/.env

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: copadrive_client
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - web-server
    networks:
      - copadrive-network
networks:
  copadrive-network:
    driver: bridge
