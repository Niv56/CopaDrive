services:

  # MongoDB Database
  database:
    image: mongo:latest
    container_name: copadrive_db
    ports:
      - "27017:27017"
    networks:
      - copadrive-network
    volumes:
      - mongo-data:/data/db

  # C++ Server
  server:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile
    container_name: copadrive_server
    ports:
      - "5555:5555"
    environment:
      - PATH_DIR=/usr/src/mytest/storage
    networks:
      - copadrive-network

  # Web Server
  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    container_name: copadrive_web
    ports:
      - "3000:3000"
    environment:
      - CPP_SERVER_HOST=server
      - CPP_SERVER_PORT=5555
      - MONGO_URI=mongodb://database:27017/copadrive
    networks:
      - copadrive-network
    env_file:
      - ./web-server/.env

  # Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: copadrive_client
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - web-server
    networks:
      - copadrive-network

  # Mobile Client
  mobile-client:
    build:
      context: ./mobile-client
      dockerfile: Dockerfile
    container_name: copadrive_mobile
    ports:
      - "8081:8081"
    depends_on:
      - web-server
    networks:
      - copadrive-network

networks:
  copadrive-network:
    driver: bridge

volumes:
  mongo-data: