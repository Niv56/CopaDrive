version: '3.9'

services:
  server:
    build: . 
    container_name: copadrive_server
    ports: 
      - "5555:5555"
    environment:
      - PATH_DIR=/user/src/mytest/storage
    command: ["5555"]

  test:
    build: .
    container_name: copadrive_test
    working_dir: /usr/src/mytest/build
    environment:
      - PATH_DIR=/usr/src/mytest/storage
    entrypoint: ["ctest", "--output-on-failure"]


