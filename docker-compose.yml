services:
  # MongoDB Database - Persists all metadata for EX5
  mongodb:
    image: mongo:7.0
    container_name: copadrive_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - copadrive-network

  # C++ Server - Raw file storage (EX3/EX4 legacy)
  server:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile
    container_name: copadrive_server
    ports:
      - "5555:5555"
    environment:
      - PATH_DIR=/usr/src/mytest/storage
    networks:
      - copadrive-network

  # Web Server - Node.js/Express with MongoDB integration
  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    container_name: copadrive_web
    ports:
      - "3000:3000"
    environment:
      - CPP_SERVER_HOST=server
      - CPP_SERVER_PORT=5555
      - CONNECTION_STRING=mongodb://mongodb:27017/copadrive
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
    depends_on:
      - mongodb
      - server
    networks:
      - copadrive-network
    # env_file remains commented to prioritize Docker environment variables
    # - ./web-server/config/.env.local

  # Web Client (React)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: copadrive_client
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - web-server
    networks:
      - copadrive-network

  # Mobile Client (React Native) - DISABLED for local development
  # Run mobile separately with: npx expo start -c
  # mobile-client:
  #   build:
  #     context: ./mobile-client
  #     dockerfile: Dockerfile
  #   container_name: copadrive_mobile
  #   ports:
  #     - "8081:8081"
  #   depends_on:
  #     - web-server
  #   networks:
  #     - copadrive-network

networks:
  copadrive-network:
    driver: bridge

volumes:
  mongodb_data: