services:
  # C++ Server (Exercise 2)
  server:
    build: 
      context: ./cpp-server
      dockerfile: Dockerfile
    container_name: copadrive_server
    ports:
      - "5555:5555"
    environment:
      - PATH_DIR=/usr/src/mytest/storage
    networks:
      - copadrive-network

  # Web Server (Exercise 3 - NodeJS MVC)
  web-server:
    build: 
      context: ./web-server
      dockerfile: Dockerfile
    container_name: copadrive_web
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Jerusalem
      - CPP_SERVER_HOST=server
      - CPP_SERVER_PORT=5555
    networks:
      - copadrive-network

  # C++ Client (For testing)
  cpp-client:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile.client.cpp
    container_name: copadrive_client_cpp
    stdin_open: true
    tty: true
    depends_on:
      - server
    command: ["server", "5555"]
    networks:
      - copadrive-network

  # Python Client (For testing)
  python-client:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile.client.python
    container_name: copadrive_client_python
    stdin_open: true
    tty: true
    depends_on:
      - server
    command: ["server", "5555"]
    networks:
      - copadrive-network

networks:
  copadrive-network:
    driver: bridge